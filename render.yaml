# Render Blueprint for the Vidyalaya OS API. The database is on Neon (free,
# no expiry): set DATABASE_URL on the dashboard to Neon's direct connection URL
# for the sms_app role. The web app runs on Vercel (see DEPLOY.md) and
# forwards /api to this service.
services:
  - type: web
    name: vidyalaya-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bin/start.sh
    healthCheckPath: /api/config
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      # Real school data: no demo data, no demo logins. Set "true" only for a
      # public demo, which reloads the demo data on every start.
      - key: DEMO_MODE
        value: "false"
      # Several people try the demo logins at once during a presentation.
      - key: LOGIN_THROTTLE_RATE
        value: "60/min"
      - key: DJANGO_TIME_ZONE
        value: Asia/Kolkata
      # Real email: links in invites and password resets point here (your
      # Vercel address), and Brevo sends them. Fill these in on the dashboard.
      - key: WEB_APP_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: JUSPAY_MERCHANT_ID
        sync: false
      - key: JUSPAY_API_KEY
        sync: false
      - key: JUSPAY_PAYMENT_PAGE_CLIENT_ID
        sync: false
      - key: JUSPAY_WEBHOOK_USERNAME
        sync: false
      - key: JUSPAY_WEBHOOK_PASSWORD
        sync: false
      # sandbox until the school goes live with Juspay, then production.
      - key: JUSPAY_ENV
        value: sandbox
